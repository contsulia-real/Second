[package]
name = "second"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
